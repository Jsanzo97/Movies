[versions]
# Project versions
jdk = "21"
java-source-min = "21"
sdk-compile = "36"
sdk-min = "24"
sdk-target = "36"
versionMajor = "1"
versionMinor = "0"
versionPatch = "0"


androidGradlePlugin = "9.0.1"
appCompat = "1.7.1"
arrow = "2.2.1.1"
chucker = "4.3.0"
constraintLayout = "2.2.1"
coreKtx = "1.17.0"
coroutines = "1.10.2"
coroutinesTest = "1.10.2"
desugarJdk = "2.1.5"
detekt = "1.23.8"
detektRulesJunit = "0.5.0"
glide = "5.0.5"
junitExt = "1.3.0"
koin = "4.1.1"
kotlin = "2.3.10"
kotlinxSerializationJson = "1.10.0"
ksp = "2.3.5"
lifecycle = "2.10.0"
material = "1.13.0"
navigation = "2.9.7"
okhttp = "5.3.2"
