name: PR Validation

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Detekt + Spotless)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Check
        run: ./gradlew check
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: '**/build/reports/detekt/'
          retention-days: 7

  build-and-test:
    name: Build & Tests
    needs: check
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Build & Tests
        run: ./gradlew assembleDebug testAll
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          SERVER_ENDPOINT: ${{ secrets.SERVER_ENDPOINT }}
          SERVER_API_KEY: ${{ secrets.SERVER_API_KEY }}

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/build/test-results/**/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Run JaCoCo
        run: ./gradlew jacocoAll
        if: always()
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/build/reports/jacoco/**/jacocoDebugTestReport.xml'
          fail_ci_if_error: false
          verbose: true