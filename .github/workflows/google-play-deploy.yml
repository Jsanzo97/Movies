name: Deploy to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal    # Pruebas internas
          - alpha       # Pruebas cerradas
          - beta        # Pruebas abiertas
          - production
      version_type:
        description: 'Version to increment'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Increment version
        if: github.event.inputs.version_type != 'none'
        run: |
          TOML_FILE="gradle/libs.versions.toml"
          TYPE="${{ github.event.inputs.version_type }}"
          
          MAJOR=$(grep "versionMajor =" $TOML_FILE | sed -E 's/.*"([^"]+)".*/\1/')
          MINOR=$(grep "versionMinor =" $TOML_FILE | sed -E 's/.*"([^"]+)".*/\1/')
          PATCH=$(grep "versionPatch =" $TOML_FILE | sed -E 's/.*"([^"]+)".*/\1/')
          
          if [ "$TYPE" == "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$TYPE" == "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$TYPE" == "patch" ]; then
            PATCH=$((PATCH + 1))
          fi
          
          sed -i "s/versionMajor = \"[^\"]*\"/versionMajor = \"$MAJOR\"/" $TOML_FILE
          sed -i "s/versionMinor = \"[^\"]*\"/versionMinor = \"$MINOR\"/" $TOML_FILE
          sed -i "s/versionPatch = \"[^\"]*\"/versionPatch = \"$PATCH\"/" $TOML_FILE
          
          echo "NEW_VERSION=$MAJOR.$MINOR.$PATCH" >> $GITHUB_ENV
          echo "✅ Version updated locally to $MAJOR.$MINOR.$PATCH"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Bundler and Dependencies
        run: |
          gem install bundler
          bundle update --bundler
          bundle install

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Remove Gradle Daemon JVM restrictions
        run: rm -f gradle/gradle-daemon-jvm.properties

      - name: Decode Google Play Key
        run: echo "${{ secrets.PLAY_STORE_JSON_KEY }}" | base64 -d > fastlane/google-play-key.json

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > release.jks
          echo "KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" > keystore.properties
          echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> keystore.properties
          echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> keystore.properties
          echo "STORE_FILE=release.jks" >> keystore.properties

      - name: Run Fastlane (Build & Upload)
        run: bundle exec fastlane deploy_play_store track:${{ github.event.inputs.track }}
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          SERVER_ENDPOINT: ${{ secrets.SERVER_ENDPOINT }}
          SERVER_API_KEY: ${{ secrets.SERVER_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Commit version bump
        if: success() && github.event.inputs.version_type != 'none'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml
          git commit -m "chore(release): bump version to ${{ env.NEW_VERSION }} [skip ci]"
          git push
