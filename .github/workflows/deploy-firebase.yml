name: Deploy to Firebase

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build Variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      version_type:
        description: 'Version to increment'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Release Notes
        run: |
          LAST_BUMP=$(git log --grep="chore: bump version" -n 1 --format="%H" || echo "")
          if [ -z "$LAST_BUMP" ]; then
            git log --pretty=format:"* %s" -n 10 > release_notes.txt
          else
            git log --pretty=format:"* %s" $LAST_BUMP..HEAD > release_notes.txt
          fi

      - name: Increment version
        if: github.event.inputs.version_type != 'none'
        run: |
          TOML_FILE="gradle/libs.versions.toml"
          TYPE="${{ github.event.inputs.version_type }}"
          
          MAJOR=$(grep "versionMajor =" $TOML_FILE | sed -E 's/.*"([^"]+)".*/\1/')
          MINOR=$(grep "versionMinor =" $TOML_FILE | sed -E 's/.*"([^"]+)".*/\1/')
          PATCH=$(grep "versionPatch =" $TOML_FILE | sed -E 's/.*"([^"]+)".*/\1/')
          
          if [ "$TYPE" == "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$TYPE" == "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$TYPE" == "patch" ]; then
            PATCH=$((PATCH + 1))
          fi
          
          sed -i "s/versionMajor = \"[^\"]*\"/versionMajor = \"$MAJOR\"/" $TOML_FILE
          sed -i "s/versionMinor = \"[^\"]*\"/versionMinor = \"$MINOR\"/" $TOML_FILE
          sed -i "s/versionPatch = \"[^\"]*\"/versionPatch = \"$PATCH\"/" $TOML_FILE
          
          echo "NEW_VERSION=$MAJOR.$MINOR.$PATCH" >> $GITHUB_ENV
          echo "✅ Version updated locally to $MAJOR.$MINOR.$PATCH"

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Decode Keystore
        if: github.event.inputs.variant == 'release'
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > release.jks
          echo "KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" > keystore.properties
          echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> keystore.properties
          echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> keystore.properties
          echo "STORE_FILE=release.jks" >> keystore.properties

      - name: Build APK
        run: ./gradlew :app:assemble${{ github.event.inputs.variant }} --parallel --build-cache
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          SERVER_ENDPOINT: ${{ secrets.SERVER_ENDPOINT }}
          SERVER_API_KEY: ${{ secrets.SERVER_API_KEY }}

      - name: Upload to Firebase App Distribution
        uses: w9jds/firebase-action@master
        with:
          args: appdistribution:distribute app/build/outputs/apk/${{ github.event.inputs.variant }}/app-${{ github.event.inputs.variant }}.apk --app ${{ github.event.inputs.variant == 'release' && secrets.FIREBASE_APP_ID_RELEASE || secrets.FIREBASE_APP_ID_DEBUG }} --groups "testers" --release-notes-file "release_notes.txt"
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Commit version bump
        if: success() && github.event.inputs.version_type != 'none'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml
          git commit -m "chore: bump version (${{ env.NEW_VERSION }}) [skip ci]"
          git push
